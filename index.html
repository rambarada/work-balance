<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Work Balance</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #0b1220;
      color: #e8eef8;
      font-family: system-ui, sans-serif;
    }
    .page {
      min-height: 100dvh;
      max-width: 420px;
      margin: 0 auto;
      padding: 24px 18px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .title { margin: 0; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; color: #7f91ad; }
    .badge {
      margin: 0;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }
    .ready { background: #14331f; color: #4ade80; }
    .live { background: #3f1510; color: #fb7185; }
    .body { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .label { margin: 0; color: #7f91ad; font-size: 14px; }
    .balance { margin: 0 0 8px; font-size: 52px; font-weight: 800; letter-spacing: -0.03em; }
    .card {
      width: 100%;
      background: #151d2e;
      border: 1px solid #243049;
      border-radius: 16px;
      padding: 12px 14px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      padding: 8px 0;
      font-size: 18px;
    }
    .row + .row { border-top: 1px solid #243049; }
    .k { color: #7f91ad; font-size: 14px; }
    .v { font-weight: 700; }
    .hint { margin: 4px 0 0; text-align: center; color: #7f91ad; font-size: 13px; }
    .btn {
      width: min(100%, 320px);
      height: 68px;
      margin-top: 8px;
      border: 0;
      border-radius: 18px;
      font-size: 22px;
      font-weight: 800;
      color: #fff;
    }
    .in { background: #16a34a; }
    .out { background: #dc2626; }
    .pos { color: #4ade80; }
    .neg { color: #fb7185; }
    .zero { color: #e8eef8; }
    .amber { color: #fbbf24; }
    .reset {
      margin-top: 8px;
      background: none;
      border: 0;
      color: #4b5d78;
      font-size: 13px;
    }
    .hidden { display: none; }
    .toast {
      position: sticky;
      top: 0;
      width: 100%;
      background: #16a34a;
      color: #fff;
      font-weight: 800;
      text-align: center;
      padding: 12px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="page">
    <p class="title">Work Balance</p>
    <p id="toast" class="toast hidden">1 minute done</p>
    <p id="badge" class="badge ready">Ready to check in</p>

    <div id="idle" class="body">
      <p class="label">Total flex</p>
      <p id="idleBal" class="balance zero">0m</p>
      <div id="lastCard" class="card hidden">
        <div class="row"><span class="k">Last worked</span><span id="lastWorked" class="v amber"></span></div>
        <div class="row"><span class="k">Last day</span><span id="lastToday" class="v"></span></div>
      </div>
      <p class="hint">Green button starts the day. After checkout you can check in again here.</p>
      <button class="btn in" type="button" id="checkIn">CHECK IN</button>
    </div>

    <div id="inSession" class="body hidden">
      <div class="card">
        <div class="row"><span class="k">Checked in</span><span id="inText" class="v pos"></span></div>
        <div class="row"><span class="k">Worked so far</span><span id="workedText" class="v amber"></span></div>
        <div class="row"><span class="k">Normal checkout</span><span id="outText" class="v"></span></div>
        <div class="row"><span class="k">Total flex</span><span id="inBal" class="v"></span></div>
      </div>
      <p class="hint">Red button ends the day and updates flex.</p>
      <button class="btn out" type="button" id="checkOut">CHECK OUT</button>
    </div>

    <button class="reset" type="button" id="reset">Reset data</button>
  </div>

  <script>
    var KEY = 'wb';
    var NOTIFY_AFTER_MINUTES = 1;

    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    function dateKey(d) {
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }
    function hm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
    function requiredMinutes(d) { return d.getDay() === 5 ? 510 : 540; }
    function fmtAbs(mins) {
      var n = Math.abs(Math.round(mins));
      var h = Math.floor(n / 60);
      var m = n % 60;
      return h > 0 ? h + ' h ' + m + ' m' : m + ' m';
    }
    function fmtDelta(mins) {
      var n = Math.round(mins);
      if (n > 0) return '+' + fmtAbs(n);
      if (n < 0) return '-' + fmtAbs(n);
      return '0m';
    }
    function tone(el, mins) {
      el.classList.remove('pos', 'neg', 'zero');
      var n = Math.round(mins);
      el.classList.add(n > 0 ? 'pos' : n < 0 ? 'neg' : 'zero');
    }

    function load() {
      try {
        return JSON.parse(localStorage.getItem(KEY) || '{}');
      } catch (e) {
        return {};
      }
    }
    function save(s) {
      localStorage.setItem(KEY, JSON.stringify(s));
    }

    var state = load();
    state.inMs = state.inMs || 0;
    state.balMins = state.balMins || 0;
    state.lastDay = state.lastDay || '';
    state.lastWorked = state.lastWorked || 0;
    state.lastToday = state.lastToday || 0;
    state.notifyFor = state.notifyFor || 0;

    function $(id) { return document.getElementById(id); }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    function askNotify() {
      if (!('Notification' in window)) return;
      if (Notification.permission === 'default') {
        Notification.requestPermission();
      }
    }

    function showBanner() {
      $('toast').textContent = '1 minute done — test notification';
      $('toast').classList.remove('hidden');
    }

    function pingDone() {
      if (!state.inMs || state.notifyFor === state.inMs) return;
      state.notifyFor = state.inMs;
      save(state);
      showBanner();
      var title = 'Work Balance';
      var opts = {
        body: 'Test: 1 minute passed. This will later be your 9 hour mark.',
        tag: 'wb-done',
        renotify: true
      };
      function fallback() {
        try { new Notification(title, opts); } catch (e) {}
      }
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      if (navigator.serviceWorker) {
        navigator.serviceWorker.ready.then(function (reg) {
          return reg.showNotification(title, opts);
        }).catch(fallback);
      } else {
        fallback();
      }
    }

    function render() {
      var now = new Date();
      var checkedIn = state.inMs > 0;
      $('idle').classList.toggle('hidden', checkedIn);
      $('inSession').classList.toggle('hidden', !checkedIn);
      $('badge').textContent = checkedIn ? 'Checked in' : 'Ready to check in';
      $('badge').className = 'badge ' + (checkedIn ? 'live' : 'ready');
      $('idleBal').textContent = fmtDelta(state.balMins);
      tone($('idleBal'), state.balMins);
      $('inBal').textContent = fmtDelta(state.balMins);
      tone($('inBal'), state.balMins);
      var hasLast = !checkedIn && state.lastDay;
      $('lastCard').classList.toggle('hidden', !hasLast);
      if (hasLast) {
        $('lastWorked').textContent = fmtAbs(state.lastWorked);
        $('lastToday').textContent = fmtDelta(state.lastToday);
        tone($('lastToday'), state.lastToday);
      }
      if (checkedIn) {
        var start = new Date(state.inMs);
        var need = requiredMinutes(start);
        var worked = Math.floor((now.getTime() - state.inMs) / 1000);
        $('inText').textContent = hm(start);
        $('workedText').textContent = fmtAbs(Math.floor(worked / 60));
        $('outText').textContent = hm(new Date(state.inMs + need * 60000));
        if (worked >= NOTIFY_AFTER_MINUTES * 60) pingDone();
      }
    }

    $('checkIn').onclick = function () {
      if (state.inMs > 0) return;
      state.inMs = Date.now();
      state.notifyFor = 0;
      save(state);
      askNotify();
      render();
    };
    $('checkOut').onclick = function () {
      if (state.inMs <= 0) return;
      var start = new Date(state.inMs);
      var worked = Math.floor((Date.now() - state.inMs) / 60000);
      var todayBal = worked - requiredMinutes(start);
      state.balMins += todayBal;
      state.lastDay = dateKey(new Date());
      state.lastWorked = worked;
      state.lastToday = todayBal;
      state.inMs = 0;
      state.notifyFor = 0;
      save(state);
      render();
    };
    $('reset').onclick = function () {
      if (!confirm('Clear all Work Balance data?')) return;
      state = { inMs: 0, balMins: 0, lastDay: '', lastWorked: 0, lastToday: 0, notifyFor: 0 };
      save(state);
      render();
    };

    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') render();
    });
    render();
    if (state.inMs > 0) askNotify();
    setInterval(render, 1000);
  </script>
</body>
</html>
