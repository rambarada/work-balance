<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Work Balance</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #111;
      color: #fff;
      font-family: system-ui, sans-serif;
    }
    .page {
      min-height: 100dvh;
      max-width: 420px;
      margin: 0 auto;
      padding: 28px 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .title { color: #888; font-size: 15px; margin: 0 0 20px; }
    .body { width: 100%; display: flex; flex-direction: column; align-items: center; }
    .label { color: #888; font-size: 16px; margin: 0; }
    .balance { font-size: 48px; margin: 8px 0 28px; font-weight: 600; }
    .row, .result { width: 100%; text-align: center; margin: 8px 0; font-size: 20px; color: #ddd; }
    .result { font-size: 22px; color: #fff; }
    .btn {
      width: min(100%, 300px);
      height: 72px;
      margin-top: 24px;
      border: 0;
      border-radius: 36px;
      font-size: 22px;
      font-weight: 700;
      color: #fff;
    }
    .in { background: #1f8a4c; }
    .out { background: #c44b2b; }
    .reset {
      margin-top: 36px;
      background: none;
      border: 0;
      color: #555;
      font-size: 14px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="page">
    <p class="title">Work Balance</p>

    <div id="idle" class="body">
      <p class="label">Flex</p>
      <p id="idleBal" class="balance">0m</p>
      <button class="btn in" type="button" id="checkIn">CHECK IN</button>
    </div>

    <div id="inSession" class="body hidden">
      <p class="row">In <span id="inText"></span></p>
      <p class="row">Worked <span id="workedText"></span></p>
      <p class="row">Out <span id="outText"></span></p>
      <p class="row">Flex <span id="inBal"></span></p>
      <button class="btn out" type="button" id="checkOut">CHECK OUT</button>
    </div>

    <div id="result" class="body hidden">
      <p id="workedLine" class="result"></p>
      <p id="todayLine" class="result"></p>
      <p id="balanceLine" class="result"></p>
    </div>

    <button class="reset" type="button" id="reset">Reset</button>
  </div>

  <script>
    var KEY = 'wb';

    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    function dateKey(d) {
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }
    function hm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
    function requiredMinutes(d) { return d.getDay() === 5 ? 510 : 540; }
    function fmtAbs(mins) {
      var n = Math.abs(Math.round(mins));
      var h = Math.floor(n / 60);
      var m = n % 60;
      return h > 0 ? h + 'h ' + m + 'm' : m + 'm';
    }
    function fmtDelta(mins) {
      var n = Math.round(mins);
      if (n > 0) return '+' + fmtAbs(n);
      if (n < 0) return '-' + fmtAbs(n);
      return '0m';
    }

    function load() {
      try {
        return JSON.parse(localStorage.getItem(KEY) || '{}');
      } catch (e) {
        return {};
      }
    }
    function save(s) {
      localStorage.setItem(KEY, JSON.stringify(s));
    }

    var state = load();
    state.inMs = state.inMs || 0;
    state.balMins = state.balMins || 0;
    state.lastDay = state.lastDay || '';
    state.lastWorked = state.lastWorked || 0;
    state.lastToday = state.lastToday || 0;
    var timer = null;

    function $(id) { return document.getElementById(id); }

    function render() {
      var now = new Date();
      var today = dateKey(now);
      var checkedIn = state.inMs > 0;
      var dayDone = !checkedIn && state.lastDay === today;
      $('idle').classList.toggle('hidden', !(!checkedIn && !dayDone));
      $('inSession').classList.toggle('hidden', !checkedIn);
      $('result').classList.toggle('hidden', !dayDone);
      $('idleBal').textContent = fmtDelta(state.balMins);
      $('inBal').textContent = fmtDelta(state.balMins);
      if (checkedIn) {
        var start = new Date(state.inMs);
        var need = requiredMinutes(start);
        var worked = Math.floor((now.getTime() - state.inMs) / 60000);
        $('inText').textContent = hm(start);
        $('workedText').textContent = fmtAbs(worked);
        $('outText').textContent = hm(new Date(state.inMs + need * 60000));
      }
      if (dayDone) {
        $('workedLine').textContent = 'Worked: ' + fmtAbs(state.lastWorked);
        $('todayLine').textContent = 'Today: ' + fmtDelta(state.lastToday);
        $('balanceLine').textContent = 'Balance: ' + fmtDelta(state.balMins);
      }
    }

    $('checkIn').onclick = function () {
      if (state.inMs > 0 || state.lastDay === dateKey(new Date())) return;
      state.inMs = Date.now();
      save(state);
      render();
    };
    $('checkOut').onclick = function () {
      if (state.inMs <= 0) return;
      var start = new Date(state.inMs);
      var worked = Math.floor((Date.now() - state.inMs) / 60000);
      var todayBal = worked - requiredMinutes(start);
      state.balMins += todayBal;
      state.lastDay = dateKey(new Date());
      state.lastWorked = worked;
      state.lastToday = todayBal;
      state.inMs = 0;
      save(state);
      render();
    };
    $('reset').onclick = function () {
      if (!confirm('Clear all Work Balance data?')) return;
      state = { inMs: 0, balMins: 0, lastDay: '', lastWorked: 0, lastToday: 0 };
      save(state);
      render();
    };

    render();
    setInterval(render, 1000);
  </script>
</body>
</html>
